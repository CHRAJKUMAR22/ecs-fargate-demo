version: 0.2

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=942198061638
      - REGION=ap-south-1
      - REPOSITORY=ecs-fargate-demo
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

  build:
    commands:
      - docker build -t $REPOSITORY .
      - docker tag $REPOSITORY:latest $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPOSITORY:latest

  post_build:
    commands:
      - docker push $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPOSITORY:latest
      - printf '[{"name":"ecs-fargate-container","imageUri":"%s"}]' $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPOSITORY:latest > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
